[package]
name = "island"
version = "0.1.0"
description = "Island — dynamic island overlay for Windows 11"
authors = ["Island Project"]
license = "MIT"
repository = "https://github.com/island-app/island"
edition = "2021"
rust-version = "1.77"

[lib]
name = "island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
keyring = "3"
log = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# тяжёлые WinRT-модули включаются отдельной фичей (см. ADR-002 «Последствия»)
win_full = []
